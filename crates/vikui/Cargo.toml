[package]
name = "vikui"
description = "A cross-platform GPUI desktop client for Vikunja"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
env_logger = "0.11"
gpui-kit = "0.9.1"
keyring = "4.2.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vikunja = { version = "0.1.0", path = "../vikunja" }

[lints]
workspace = true
