[package]
name = "vikui"
description = "A cross-platform GPUI desktop client for Vikunja"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
autostart.workspace = true
env_logger.workspace = true
filter-editor-ui.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
labels-ui.workspace = true
log.workspace = true
login.workspace = true
login-ui.workspace = true
new-reminder.workspace = true
new-reminder-ui.workspace = true
overview-ui.workspace = true
project-editor-ui.workspace = true
projects-ui.workspace = true
reminder-details.workspace = true
reminder-details-ui.workspace = true
reminders.workspace = true
reminders-ui.workspace = true
settings-ui.workspace = true
tray.workspace = true
# Names the OS and its version in bug reports.
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
url.workspace = true
preferences.workspace = true
updater.workspace = true
vikunja.workspace = true

# Embeds the app icon in vikui.exe; only Windows hosts can compile the resource.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
