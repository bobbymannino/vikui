[package]
name = "tray"
description = "Vikui's tray icon (menu bar on macOS, notification area on Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-channel = "2.5.0"
log.workspace = true

# Linux would need GTK running on a thread of its own; the tray is macOS and Windows only.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[lints]
workspace = true
