<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Vikui</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CF6"/>
      <stop offset="1" stop-color="#3B5BDB"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F59F00"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: an 824px tile centred on the 1024px canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- A check mark that reads as a "V". -->
  <path d="M310 540 L460 690 L690 420" fill="none" stroke="#FFFFFF" stroke-width="96"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Reminder badge. -->
  <circle cx="772" cy="252" r="72" fill="url(#dot)" stroke="#FFFFFF" stroke-width="20"/>
</svg>
